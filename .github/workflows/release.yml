name: Release
on:
  workflow_call:
    inputs:
      go-version:
        required: true
        type: string
permissions: {}
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  version:
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: flanksource/action-workflows/.github/workflows/create-release.yml@807c141342c97374e637b4375e3a54e62cd8736e # v1.3.0
  binaries:
    needs: version
    if: needs.version.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.12.7
          args: release --clean --parallelism 2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  docker:
    needs: version
    if: needs.version.outputs.published == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: flanksource/action-workflows/.github/workflows/publish-multi-platform-docker-image.yml@807c141342c97374e637b4375e3a54e62cd8736e # v1.3.0
    with:
      login_to_dockerhub: false
      platforms: linux/amd64,linux/arm64
      image_tags: |
        ghcr.io/${{ github.repository }}:${{ needs.version.outputs.tag }}
        ghcr.io/${{ github.repository }}:${{ needs.version.outputs.version }}
        ghcr.io/${{ github.repository }}:latest
      build_args: |
        VERSION=${{ needs.version.outputs.version }}
        GO_VERSION=${{ inputs.go-version }}
  smoke:
    needs: [version, binaries, docker]
    if: needs.version.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify published image
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ needs.docker.outputs.digest }}
          VERSION: ${{ needs.version.outputs.version }}
        run: bash .github/scripts/smoke-image.sh "$IMAGE" "$VERSION"
  publish:
    needs: [version, smoke]
    if: needs.version.outputs.published == 'true'
    permissions:
      contents: write
    uses: flanksource/action-workflows/.github/workflows/publish-release.yml@807c141342c97374e637b4375e3a54e62cd8736e # v1.3.0
    with:
      tag: ${{ needs.version.outputs.tag }}
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
