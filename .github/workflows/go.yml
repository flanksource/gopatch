name: Go
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
env:
  GOWORK: "off"
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - run: make lint lint-hack
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - run: make build build-hack
      - run: go mod verify
      - run: go -C hack/gopatch-effectiveness mod verify
      - run: go mod tidy -diff
      - run: go -C hack/gopatch-effectiveness mod tidy -diff
      - run: make cover test-hack
      - uses: codecov/codecov-action@v4
        with:
          files: cover.out
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  image:
    runs-on: ubuntu-latest
    outputs:
      go-version: ${{ steps.go.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - id: go
        run: echo "version=$(go env GOVERSION | cut -c3-)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: gopatch:ci
          build-args: |
            VERSION=ci
            GO_VERSION=${{ steps.go.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
      - run: bash .github/scripts/smoke-image.sh gopatch:ci ci
  release:
    needs: [lint, test, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      go-version: ${{ needs.image.outputs.go-version }}
