version: 2
project_name: gopatch
dist: .tmp/dist
builds:
  - main: .
    binary: gopatch
    env: [CGO_ENABLED=0, GOWORK=off]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags: '-s -w -X main._version={{.Version}}'
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: 'gopatch_{{ title .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}'
    files: [LICENSE, README.md]
checksum:
  name_template: checksums.txt
snapshot:
  version_template: '{{ incpatch .Version }}-dev'
changelog:
  disable: true
release:
  draft: true
  mode: keep-existing
